<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password recovery - Gym Management System</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f8; font-family: Arial, sans-serif; color: #1f2937; }
        main { width: min(420px, calc(100% - 48px)); padding: 36px; background: #fff; border-radius: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); }
        h1 { margin-top: 0; }
        label { display: block; margin: 18px 0 7px; font-weight: 600; }
        input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; }
        button { width: 100%; margin-top: 20px; padding: 13px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
        .message { padding: 11px 13px; border-radius: 8px; background: #dcfce7; color: #166534; }
        a { display: inline-block; margin-top: 18px; color: #2563eb; }
    </style>
</head>

<body>
    <main>
        <h1>Forgot password?</h1>
        <p>Enter your email address. If the account exists, recovery instructions will be sent.</p>
        {% if message %}<div class="message">{{ message }}</div>{% endif %}
        {% if not message %}
        <form method="post" action="/account/password/reset-request">
            <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">
            <button type="submit">Send recovery instructions</button>
        </form>
        {% endif %}
        <a href="/login">Return to sign in</a>
    </main>
</body>

</html>
